spring.application.name=pokemonscraping

spring.datasource.url=jdbc:h2:file:./data/pokemonscrapingdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

cardtrader.api.base-url=${CARDTRADER_API_BASE_URL:https://api.cardtrader.com/api/v2}
cardtrader.api.token=${CARDTRADER_API_TOKEN:}
cardtrader.api.connect-timeout=${CARDTRADER_CONNECT_TIMEOUT:5s}
cardtrader.api.read-timeout=${CARDTRADER_READ_TIMEOUT:20s}

monitoring.schedule.cron=${MONITORING_SCHEDULE_CRON:0 0 6 * * MON}
monitoring.schedule.zone=${MONITORING_SCHEDULE_ZONE:Europe/Rome}
